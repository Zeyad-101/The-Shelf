<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — The Shelf</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<div class="wall" id="wall">

    <div class="login-subtitle" style="margin-bottom: 24px;">This shelf doesn't exist or has been removed.</div>

    <a href="/" class="google-btn" style="text-decoration: none; justify-content: center; display: inline-flex;">
