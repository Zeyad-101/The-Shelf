<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 � The Shelf</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#754A2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Shelf">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="wall" id="wall">
  <div class="wall-grain"></div>
  <!-- Lamp -->
  <div class="lamp-wrap">
    <div class="lamp-cord"></div>
    <div class="lamp-shade"></div>
  </div>
  <div class="lamp-glow"></div>
  <!-- 404 Card -->
  <div class="login-card">
    <div class="login-title" style="font-size: 32px; margin-bottom: 8px;">404</div>
    <div class="login-subtitle" style="margin-bottom: 24px;">This shelf doesn't exist or has been removed.</div>
    <a href="/" class="google-btn" style="text-decoration: none; justify-content: center; display: inline-flex;">
      Return to Room
    </a>
  </div>
</div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>

</html>
