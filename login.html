<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Shelf — Your personal display room</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#754A2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Shelf">

  <meta name="description" content="The Shelf — Your personal display room for books, movies, music, and decorative objects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wall" id="wall">
  <div class="wall-grain"></div>
  <!-- Lamp -->
  <div class="lamp-wrap">
    <div class="lamp-cord"></div>
    <div class="lamp-shade"></div>
  </div>
  <div class="lamp-glow"></div>
  <!-- Login Card -->
  <div class="login-card">
    <div class="login-title">The Shelf</div>
    <div class="login-subtitle">Your personal display room</div>
    <button class="google-btn" id="google-sign-in">
      <!-- Google G logo SVG -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>
    <div id="login-error"></div>
  </div>
</div>
<script type="module">
  import { supabase } from './js/supabaseClient.js';
  import { signInWithGoogle } from './js/auth.js';
  // Redirect if already signed in
  (async () => {
    const { data } = await supabase.auth.getSession();
    if (data.session) { window.location.href = '/room.html'; }
  })();
  const btn = document.getElementById('google-sign-in');
  btn.addEventListener('click', async () => {
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = '';
    btn.disabled = true;
    btn.style.opacity = '0.7';
    try {
      await signInWithGoogle();
    } catch (err) {
      errorEl.textContent = err.message || 'Sign-in failed. Please try again.';
      btn.disabled = false;
      btn.style.opacity = '1';
    }
  });
</script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>

</html>
